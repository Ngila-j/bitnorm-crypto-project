# BitNorm CI – smoke tests (Phase 4)
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check core modules
        run: |
          python -m py_compile pipeline.py exchange_adapter.py api.py
          python -m py_compile app.py || true
          # analytics.py may live only on developer machines; compile if present
          if [ -f analytics.py ]; then python -m py_compile analytics.py; fi

      - name: Generate demo data
        run: python pipeline.py

      - name: Exchange adapter mock refresh
        run: |
          export EXCHANGE_MODE=mock
          python exchange_adapter.py

      - name: Import API module
        run: |
          python -c "import exchange_adapter; print('exchange_adapter OK', exchange_adapter.get_mode())"
